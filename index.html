<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ファビコン（複数サイズ対応） -->
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>キャンバスサイズ 標準縦横比 近似ツール</title>

<script src="https://cdn.tailwindcss.com"></script>
<style>
	body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
	.icon { width: 1rem; height: 1rem; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; }
	.icon-lg { width: 1.25rem; height: 1.25rem; }
	.icon-xl { width: 1.5rem; height: 1.5rem; }
	.tiny { font-size: 0.625rem; line-height: 0.875rem; }
	input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }
	.copied-flash { animation: flash 0.6s ease; }
	@keyframes flash { 0%,100%{background-color:#0f172a} 50%{background-color:#065f46} }
</style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-white to-blue-50 text-slate-800 min-h-screen">

<div class="max-w-5xl mx-auto p-4 sm:p-8">
	<!-- Header -->
	<header class="mb-8">
		<div class="flex items-center gap-3 mb-2">
			<div class="p-2 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 shadow-md text-white">
				<svg class="icon icon-xl" viewBox="0 0 24 24"><path d="M21 3 3 21"/><path d="M12.5 3H21v8.5"/><path d="m15 6 3 3"/><path d="m9 12 3 3"/><path d="m6 15 3 3"/></svg>
			</div>
			<h1 class="text-2xl sm:text-3xl font-bold text-slate-900">アスペクト比 近似 & スケーリング計算機</h1>
		</div>
		<p class="text-slate-500 ml-1 text-sm">入力キャンバスサイズを標準縦横比に近似し、7段階の候補サイズを自動生成します。</p>
	</header>

	<!-- Input -->
	<section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
		<div class="flex items-center justify-between gap-2 mb-4">
			<div class="flex items-center gap-2 text-blue-600">
				<svg class="icon icon-lg" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
				<h2 class="font-semibold text-slate-800">キャンバスサイズを入力</h2>
			</div>
			<button id="swapBtn" type="button"
							class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
				<svg class="icon" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
				縦横を入れ替え
			</button>
		</div>
		<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
			<div>
				<label class="block text-xs font-medium text-slate-600 mb-1.5">幅 (Width) px</label>
				<input id="inputWidth" type="number" min="1" step="1" value="537"
								class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition">
			</div>
			<div>
				<label class="block text-xs font-medium text-slate-600 mb-1.5">高さ (Height) px</label>
				<input id="inputHeight" type="number" min="1" step="1" value="671"
								class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition">
			</div>
		</div>
		<div class="flex flex-wrap gap-2" id="presets">
			<span class="text-xs text-slate-500 self-center mr-1">プリセット:</span>
		</div>
	</section>

	<div id="resultArea"></div>
</div>

<script>
	// 標準縦横比（重複していた 1:1.33 を 3:5 に変更して被りを解消）
	const standardRatios = [
		{ label: '1:1',    w: 1,  h: 1  },
		{ label: '2:3',    w: 2,  h: 3  },
		{ label: '3:4',    w: 3,  h: 4  },
		{ label: '3:5',    w: 3,  h: 5  },
		{ label: '4:5',    w: 4,  h: 5  },
		{ label: '5:7',    w: 5,  h: 7  },
		{ label: '9:16',   w: 9,  h: 16 },
		{ label: '9:17',   w: 9,  h: 17 },
		{ label: '11:17',  w: 11, h: 17 },
	];

	const presets = [
		{ label: '537 × 671',   w: 537,  h: 671  },
		{ label: '1920 × 1080', w: 1920, h: 1080 },
		{ label: '1080 × 1350', w: 1080, h: 1350 },
		{ label: '1440 × 2560', w: 1440, h: 2560 },
		{ label: '600 × 600',   w: 600,  h: 600  },
	];

	const widthInput  = document.getElementById('inputWidth');
	const heightInput = document.getElementById('inputHeight');
	const presetsEl   = document.getElementById('presets');
	const resultArea  = document.getElementById('resultArea');
	const swapBtn     = document.getElementById('swapBtn');

	// プリセット生成
	presets.forEach(p => {
		const btn = document.createElement('button');
		btn.type = 'button';
		btn.className = 'px-3 py-1 text-xs font-medium rounded-full bg-slate-100 hover:bg-blue-100 hover:text-blue-700 text-slate-600 transition';
		btn.textContent = p.label;
		btn.addEventListener('click', () => {
			widthInput.value  = p.w;
			heightInput.value = p.h;
			render();
		});
		presetsEl.appendChild(btn);
	});

	widthInput.addEventListener('input', render);
	heightInput.addEventListener('input', render);
	swapBtn.addEventListener('click', () => {
		const w = widthInput.value, h = heightInput.value;
		widthInput.value = h;
		heightInput.value = w;
		render();
	});

	// n を「キリの良い」整数に丸める
	function roundNice(n) {
		if (!isFinite(n) || n <= 0) return 100;
		if (n < 5)   return Math.max(4, Math.round(n));
		if (n < 20)  return Math.round(n / 4)  * 4;
		if (n < 80)  return Math.round(n / 20) * 20;
		return Math.max(100, Math.round(n / 100) * 100);
	}

	function formatNum(n) {
		const r = Math.round(n * 100) / 100;
		return (Math.round(r) === r) ? String(Math.round(r)) : String(r);
	}

	function compute(W, H) {
		if (!isFinite(W) || !isFinite(H) || W <= 0 || H <= 0) return null;
		const isPortrait = H >= W;
		const little = Math.min(W, H);
		const large  = Math.max(W, H);
		const rawRatio = little / large;

		const scored = standardRatios.map(r => {
			const val = r.w / r.h;
			return { ...r, val, error: Math.abs(rawRatio - val) };
		});
		const closest = scored.reduce((a, b) => (a.error < b.error ? a : b));

		const area = W * H;
		const baseRatioProduct = closest.w * closest.h;
		const nExact = Math.sqrt(area / baseRatioProduct);
		const baseN  = roundNice(nExact);

		const multipliers = [0.25, 0.5, 0.75, 1.0, 2.0, 3.0, 4.0];
		const candidates = multipliers.map((m, i) => {
			const n = baseN * m;
			const smallSide = closest.w * n;
			const largeSide = closest.h * n;
			const cw = isPortrait ? smallSide : largeSide;
			const ch = isPortrait ? largeSide : smallSide;
			const mag = Math.sqrt((cw * ch) / area);
			return {
				idx: i + 1,
				multiplier: m,
				width:  formatNum(cw),
				height: formatNum(ch),
				rawWidth:  cw,
				rawHeight: ch,
				magnification: (Math.round(mag * 10000) / 10000).toFixed(4),
			};
		});

		return {
			W, H, isPortrait, little, large, rawRatio,
			rawRatioRounded: Math.round(rawRatio * 1000) / 1000,
			rawRatioCompact: Math.round(rawRatio * 100) / 100,
			closest, scored, baseN, nExact, candidates,
		};
	}

	function renderEmpty() {
		resultArea.innerHTML = `
			<div class="bg-white border border-dashed border-slate-300 text-slate-500 rounded-2xl p-8 text-center">
				<svg class="icon icon-xl mx-auto mb-2 text-slate-400" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
				<p class="text-sm">幅と高さに正の数値を入力してください。</p>
			</div>`;
	}

	function render() {
		const wRaw = widthInput.value.trim();
		const hRaw = heightInput.value.trim();
		if (wRaw === '' || hRaw === '') { renderEmpty(); return; }

		const W = Number(wRaw);
		const H = Number(hRaw);
		const result = compute(W, H);
		if (!result) { renderEmpty(); return; }

		const baseCand = result.candidates.find(c => c.multiplier === 1.0);

		// Step 1
		let html = `
			<section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
				<div class="flex items-center gap-2 mb-4">
					<span class="flex items-center justify-center w-7 h-7 rounded-lg bg-blue-100 text-blue-700 text-sm font-bold">1</span>
					<h2 class="font-semibold text-slate-800">アスペクト比（縦横比）の算出</h2>
				</div>
				<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
					<div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
						<p class="text-xs text-slate-500 mb-1">入力サイズ</p>
						<p class="text-lg font-semibold text-slate-800">${result.W} × ${result.H} px</p>
						<p class="text-xs text-slate-500 mt-1">${result.isPortrait ? '縦長 (Portrait)' : '横長 (Landscape)'}</p>
					</div>
					<div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
						<p class="text-xs text-slate-500 mb-1">正規化比 (短辺 : 長辺)</p>
						<p class="text-lg font-semibold text-slate-800">${result.little} : ${result.large}</p>
						<p class="text-xs text-slate-500 mt-1">${result.little} ÷ ${result.large} ≈ ${result.rawRatioRounded.toFixed(3)}</p>
					</div>
					<div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl p-4 border border-blue-100">
						<p class="text-xs text-blue-600 mb-1">比の数値（近似前）</p>
						<p class="text-lg font-semibold text-blue-900">≈ ${result.rawRatioRounded.toFixed(3)}</p>
						<p class="text-xs text-blue-600 mt-1">≒ ${result.rawRatioCompact.toFixed(2)}</p>
					</div>
				</div>
			</section>
		`;

		// Step 2
		html += `
			<section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
				<div class="flex items-center gap-2 mb-4">
					<span class="flex items-center justify-center w-7 h-7 rounded-lg bg-indigo-100 text-indigo-700 text-sm font-bold">2</span>
					<h2 class="font-semibold text-slate-800">最も近い標準縦横比の選定</h2>
					<svg class="icon ml-auto text-indigo-500" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
				</div>
				<div class="grid grid-cols-3 sm:grid-cols-5 lg:grid-cols-9 gap-2 mb-4">
					${result.scored.map(r => {
						const sel = r.label === result.closest.label;
						return `
							<div class="text-center p-2.5 rounded-lg border transition ${sel ? 'bg-gradient-to-br from-emerald-50 to-teal-50 border-emerald-400 shadow-sm ring-2 ring-emerald-200' : 'bg-slate-50 border-slate-200'}">
								<p class="text-sm font-bold ${sel ? 'text-emerald-700' : 'text-slate-700'}">${r.label}</p>
								<p class="tiny text-slate-500 mt-0.5">${r.val.toFixed(3)}</p>
								<p class="tiny mt-0.5 ${sel ? 'text-emerald-600 font-semibold' : 'text-slate-400'}">Δ ${r.error.toFixed(3)}</p>
							</div>`;
					}).join('')}
				</div>
				<div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center flex-wrap gap-2">
					<svg class="icon text-emerald-600" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
					<span class="text-sm text-emerald-800"><span class="font-semibold">選定結果:</span> 最小誤差は</span>
					<span class="px-2.5 py-1 bg-white rounded-md text-emerald-700 font-bold text-sm border border-emerald-200">${result.closest.label}</span>
					<span class="text-xs text-emerald-700">(値 ${result.closest.val.toFixed(3)} / 誤差 ${result.closest.error.toFixed(4)})</span>
				</div>
			</section>
		`;

		// Summary
		html += `
			<section class="bg-gradient-to-r from-slate-900 to-slate-700 rounded-2xl p-5 mb-6 shadow-md">
				<p class="text-xs text-slate-300 mb-2 flex items-center gap-1.5">
					<svg class="icon" viewBox="0 0 24 24" style="width:.875rem;height:.875rem"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
					判定サマリー
				</p>
				<div class="flex flex-wrap items-center gap-2 text-white font-mono text-sm sm:text-base">
					<span>[${result.little} ÷ ${result.large} ≈ ${result.rawRatioRounded.toFixed(3)} ≒ ${result.rawRatioCompact.toFixed(2)}]</span>
					<svg class="icon text-slate-400" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
					<span class="text-emerald-300">[縦横比 ${result.closest.label}]</span>
					<svg class="icon text-slate-400" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
					<span class="text-blue-300">[${baseCand.width}×${baseCand.height} px (×${baseCand.magnification})]</span>
				</div>
			</section>
		`;

		// 候補テーブル — プレビューサイズの基準は最大候補
		const last = result.candidates[result.candidates.length - 1];
		const baseMaxSide = Math.max(last.rawWidth, last.rawHeight, 1);
		const maxPreview = 70;

		html += `
			<section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6">
				<div class="flex items-center gap-2 mb-1">
					<span class="flex items-center justify-center w-7 h-7 rounded-lg bg-purple-100 text-purple-700 text-sm font-bold">3</span>
					<h2 class="font-semibold text-slate-800">拡大縮小による候補サイズ（全7件）</h2>
					<svg class="icon ml-auto text-purple-500" viewBox="0 0 24 24"><path d="M21 21H3V3"/><path d="m21 3-9 9"/><path d="M15 3h6v6"/></svg>
				</div>
				<p class="text-xs text-slate-500 mb-4 ml-9">基準 n = ${result.baseN}（${result.closest.label} の両辺に掛ける整数。理論値 n ≈ ${result.nExact.toFixed(2)}）／ 倍率は √(候補面積 ÷ 元面積)</p>
				<div class="overflow-x-auto">
					<table class="w-full text-sm">
						<thead>
							<tr class="border-b border-slate-200 text-slate-500 text-xs">
								<th class="text-left py-2 px-2 font-medium">#</th>
								<th class="text-left py-2 px-2 font-medium">係数</th>
								<th class="text-left py-2 px-2 font-medium">幅 × 高さ (px)</th>
								<th class="text-left py-2 px-2 font-medium">縦横比</th>
								<th class="text-left py-2 px-2 font-medium">倍率 (面積√)</th>
								<th class="text-left py-2 px-2 font-medium hidden sm:table-cell">プレビュー</th>
							</tr>
						</thead>
						<tbody>
							${result.candidates.map(c => {
								const isBase = c.multiplier === 1.0;
								const pwPx = Math.max((c.rawWidth  / baseMaxSide) * maxPreview, 4);
								const phPx = Math.max((c.rawHeight / baseMaxSide) * maxPreview, 4);
								const magNum = parseFloat(c.magnification);
								const magCls = magNum > 1 ? 'text-rose-600' : magNum < 1 ? 'text-sky-600' : 'text-slate-700';
								return `
									<tr class="border-b border-slate-100 hover:bg-slate-50 transition ${isBase ? 'bg-blue-50/50' : ''}">
										<td class="py-3 px-2">
											<span class="inline-flex items-center justify-center w-6 h-6 rounded-md text-xs font-bold ${isBase ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}">${c.idx}</span>
										</td>
										<td class="py-3 px-2 font-mono text-xs text-slate-600">×${c.multiplier.toFixed(2)}${isBase ? ' <span class="text-blue-600 font-semibold">(基準)</span>' : ''}</td>
										<td class="py-3 px-2">
											<span class="font-mono font-semibold ${isBase ? 'text-blue-700' : 'text-slate-800'}">${c.width} × ${c.height}</span>
										</td>
										<td class="py-3 px-2">
											<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded text-xs font-semibold">${result.closest.label}</span>
										</td>
										<td class="py-3 px-2 font-mono text-sm">
											<span class="${magCls}">×${c.magnification}</span>
										</td>
										<td class="py-3 px-2 hidden sm:table-cell">
											<div class="bg-gradient-to-br from-indigo-200 to-blue-300 rounded border border-indigo-300"
														style="width:${pwPx}px;height:${phPx}px;"></div>
										</td>
									</tr>`;
							}).join('')}
						</tbody>
					</table>
				</div>
			</section>
		`;

		// Step 4 最終出力
		const outputLines = [
			`# 自動決定セクション: 【${result.closest.label} 標準比 候補一覧】`,
			`# [${result.little} ÷ ${result.large} ≈ ${result.rawRatioRounded.toFixed(3)} ≒ ${result.rawRatioCompact.toFixed(2)}] → [縦横比 ${result.closest.label}]`,
			...result.candidates.map(c =>
				`候補${c.idx}（×${c.multiplier.toFixed(2)}）: ${c.width}px : ${c.height}px = ${result.closest.label} | 倍率 = ×${c.magnification}`
			)
		];
		const plainOutput = outputLines.join('\n');

		html += `
			<section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
				<div class="flex items-center gap-2 mb-4">
					<span class="flex items-center justify-center w-7 h-7 rounded-lg bg-amber-100 text-amber-700 text-sm font-bold">4</span>
					<h2 class="font-semibold text-slate-800">最終出力フォーマット</h2>
					<button id="copyBtn" type="button"
									class="ml-auto flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
						<svg class="icon" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
						<span id="copyLabel">コピー</span>
					</button>
				</div>
				<div id="outputBlock" class="bg-slate-900 rounded-xl p-4 font-mono text-xs sm:text-sm overflow-x-auto whitespace-pre">
<span class="text-emerald-400">${escapeHtml(outputLines[0])}</span>
<span class="text-slate-400">${escapeHtml(outputLines[1])}</span>
${result.candidates.map(c => 
`<span class="text-amber-300">候補${c.idx}</span><span class="text-slate-500">（×${c.multiplier.toFixed(2)}）:</span> <span class="text-white font-bold">${c.width}px : ${c.height}px</span> = <span class="text-emerald-300">${result.closest.label}</span> <span class="text-slate-500">| 倍率 =</span> <span class="text-sky-300">×${c.magnification}</span>`
).join('\n')}</div>
			</section>
			<footer class="mt-6 text-center text-xs text-slate-400">
				Light Theme · すべての倍率は √(候補面積 / 元面積) に基づき小数第4位で算出
			</footer>
		`;

		resultArea.innerHTML = html;

		// コピー機能
		const copyBtn = document.getElementById('copyBtn');
		const copyLabel = document.getElementById('copyLabel');
		const outputBlock = document.getElementById('outputBlock');
		if (copyBtn) {
			copyBtn.addEventListener('click', async () => {
				try {
					if (navigator.clipboard && window.isSecureContext) {
						await navigator.clipboard.writeText(plainOutput);
					} else {
						const ta = document.createElement('textarea');
						ta.value = plainOutput;
						ta.style.position = 'fixed';
						ta.style.opacity = '0';
						document.body.appendChild(ta);
						ta.select();
						document.execCommand('copy');
						document.body.removeChild(ta);
					}
					copyLabel.textContent = 'コピーしました';
					outputBlock.classList.add('copied-flash');
					setTimeout(() => {
						copyLabel.textContent = 'コピー';
						outputBlock.classList.remove('copied-flash');
					}, 1500);
				} catch (e) {
					copyLabel.textContent = '失敗';
					setTimeout(() => { copyLabel.textContent = 'コピー'; }, 1500);
				}
			});
		}
	}

	function escapeHtml(s) {
		return String(s).replace(/[&<>"']/g, c =>
			({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
	}

	render();
</script>
</body>
</html>
